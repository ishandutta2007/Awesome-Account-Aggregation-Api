<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Glow -->
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Theme Colors Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <style>
    .pulse {
      animation: pulse-anim 3s infinite alternate;
    }
    @keyframes pulse-anim {
      0% { opacity: 0.3; }
      100% { opacity: 0.9; }
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: flow-anim 15s linear infinite;
    }
    @keyframes flow-anim {
      to {
        stroke-dashoffset: -100;
      }
    }
    .text-title {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: url(#primary-grad);
    }
    .text-subtitle {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #8b949e;
      letter-spacing: 1px;
    }
    .node {
      animation: float-node 4s ease-in-out infinite alternate;
    }
    @keyframes float-node {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-5px); }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="10" />

  <!-- Connecting Lines (Data Flows) -->
  <g stroke="#3b82f6" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="50" x2="300" y2="100" class="flow-line" />
    <line x1="100" y1="150" x2="300" y2="100" class="flow-line" />
    <line x1="700" y1="50" x2="500" y2="100" class="flow-line" stroke="#8b5cf6" />
    <line x1="700" y1="150" x2="500" y2="100" class="flow-line" stroke="#8b5cf6" />
    <line x1="300" y1="100" x2="500" y2="100" class="flow-line" stroke="url(#primary-grad)" stroke-width="2" />
  </g>

  <!-- Animated Background Nodes -->
  <g class="pulse">
    <circle cx="100" cy="50" r="40" fill="#3b82f6" opacity="0.05" />
    <circle cx="100" cy="150" r="40" fill="#3b82f6" opacity="0.05" />
    <circle cx="700" cy="50" r="40" fill="#8b5cf6" opacity="0.05" />
    <circle cx="700" cy="150" r="40" fill="#8b5cf6" opacity="0.05" />
  </g>

  <!-- Node Elements -->
  <g class="node">
    <!-- Center Aggregator Node -->
    <circle cx="400" cy="100" r="24" fill="url(#primary-grad)" filter="url(#node-glow)" />
    <path d="M394 100 h12 M400 94 v12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Source Nodes -->
    <circle cx="100" cy="50" r="14" fill="#3b82f6" />
    <text x="100" y="54" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🏦</text>
    
    <circle cx="100" cy="150" r="14" fill="#10b981" />
    <text x="100" y="154" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">💳</text>

    <!-- Destination Nodes -->
    <circle cx="700" cy="50" r="14" fill="#8b5cf6" />
    <text x="700" y="54" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">📱</text>

    <circle cx="700" cy="150" r="14" fill="#ec4899" />
    <text x="700" y="154" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">💻</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(400, 100)" text-anchor="middle">
    <!-- Offset Text for Backdrop / Glow -->
    <text y="-25" class="text-title" filter="url(#glow)">Awesome Account Aggregation APIs</text>
    <text y="30" class="text-subtitle">Open Banking &amp; Financial Connectivity Ecosystem</text>
  </g>
</svg>
